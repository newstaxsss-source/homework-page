<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Домашка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 20px 40px rgba(0,0,0,0.12);
            --radius: 24px;
            --accent: #6c5ce7;
            --success: #00b894;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { 
            font-size: clamp(24px, 8vw, 38px); 
            font-weight: 800; 
            background: linear-gradient(135deg, #6c5ce7, #ff7675);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .nav-controls { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: space-between; }
        @media (min-width: 768px) { .nav-controls { width: auto; } }

        .nav-btn {
            background: var(--card-bg);
            border: none;
            padding: 12px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: var(--shadow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            border: 1px solid rgba(0,0,0,0.03);
            flex: 1;
            max-width: 100px;
            display: flex; justify-content: center;
        }
        .nav-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        
        .current-week { font-weight: 700; color: var(--text-muted); flex: 2; text-align: center; font-size: 14px; }

        .schedule-grid { display: flex; flex-direction: column; gap: 30px; }
        .row-top, .row-bottom { display: grid; gap: 25px; grid-template-columns: 1fr; width: 100%; }

        @media (min-width: 1024px) {
            .row-top { grid-template-columns: repeat(3, 1fr); }
            .row-bottom { grid-template-columns: repeat(2, 1fr); max-width: 925px; margin: 0 auto; }
        }

        .day-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.02);
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        @media (min-width: 1024px) {
            .day-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-hover); }
        }

        .day-header { padding: 20px 25px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .day-name { font-weight: 800; font-size: clamp(18px, 5vw, 22px); }
        .day-date { font-size: 13px; opacity: 0.9; font-weight: 600; background: rgba(0,0,0,0.1); padding: 4px 10px; border-radius: 8px; }

        .lessons-list { padding: 15px; }
        .lesson-item {
            display: flex; align-items: center;
            padding: clamp(12px, 4vw, 16px) clamp(15px, 4vw, 20px);
            border-radius: 18px; margin-bottom: 8px; cursor: pointer;
            background: #fcfcfc; border: 1px solid rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            position: relative;
        }
        .lesson-item:hover { background: #ffffff; transform: scale(1.02); box-shadow: 0 5px 15px rgba(0,0,0,0.04); border-color: rgba(108, 92, 231, 0.1); }
        
        .lesson-item.is-done { opacity: 0.55; }
        .lesson-item.is-done .lesson-name { text-decoration: line-through; color: var(--text-muted); }

        .lesson-num {
            width: 30px; height: 30px; background: #fff; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; margin-right: 15px; color: #6c5ce7;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .lesson-name { flex-grow: 1; font-weight: 600; font-size: clamp(15px, 4.5vw, 17px); color: #2d3436; margin-right: 10px; }
        
        .lesson-indicators { display: flex; gap: 8px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-note { background: #6c5ce7; box-shadow: 0 0 10px rgba(108, 92, 231, 0.6); }
        .dot-photo { background: #ff7675; box-shadow: 0 0 10px rgba(255, 118, 117, 0.6); }

        .done-toggle {
            width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid #e0e0e0; background: white;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease-out;
            cursor: pointer; flex-shrink: 0;
            font-size: 14px; color: transparent;
            font-weight: bold;
        }
        .done-toggle.active { background: var(--success); border-color: var(--success); color: white; transform: scale(1.1); }
        .done-toggle:hover { border-color: var(--success); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 52, 54, 0.8); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        @media (min-width: 768px) { .modal-overlay { align-items: center; padding: 20px; } }

        .modal {
            background: white; width: 100%; max-width: 550px;
            border-radius: 32px 32px 0 0; padding: 30px 20px 40px 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); position: relative;
            max-height: 90vh; overflow-y: auto;
        }
        @media (min-width: 768px) { .modal { border-radius: 32px; padding: 40px; } }

        textarea {
            width: 100%; height: 140px; padding: 15px; border-radius: 18px;
            border: 2px solid #f1f2f6; resize: none; font-family: inherit; font-size: 16px;
            margin-bottom: 20px; background: #fdfdfd;
        }

        .btn {
            padding: 16px; border-radius: 16px; border: none; font-weight: 800; font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: all 0.2s;
        }
        .btn-upload { background: #f1f2f6; color: #2d3436; margin-bottom: 12px; }
        .btn-save { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; }

        .close-modal {
            position: absolute; top: 25px; right: 20px;
            background: #f1f2f6; border: none; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; font-weight: bold;
        }

        .photo-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .img-wrap { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .del-img { position: absolute; top: 4px; right: 4px; background: rgba(255,118,117,0.9); color: white; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 10px; cursor: pointer; }

        #imageViewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        #imageViewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        #imageViewer .close-viewer { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }

        /* Плашка-уведомление (Toast) */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 30px rgba(0, 184, 148, 0.35);
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Домашка</h1>
        <div class="nav-controls">
            <button class="nav-btn" onclick="changeWeek(-1)">←</button>
            <div class="current-week" id="weekRange">...</div>
            <button class="nav-btn" onclick="goToToday()">Сегодня</button>
            <button class="nav-btn" onclick="changeWeek(1)">→</button>
        </div>
    </header>
    <div class="schedule-grid" id="schedule">
        <div class="row-top" id="topRow"></div>
        <div class="row-bottom" id="bottomRow"></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-modal" onclick="closeModal()">✕</button>
        <div class="modal-title" id="modalTitle" style="font-weight: 800; font-size: 22px; margin-bottom: 5px;">Урок</div>
        <div class="modal-subtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Заметки и фотографии</div>
        <textarea id="noteText" placeholder="Что задали?"></textarea>
        <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleFiles(this.files)">
        <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📸 Добавить фото</button>
        <div class="photo-preview" id="photoPreview"></div>
        <button class="btn btn-save" onclick="saveData()">Сохранить всё</button>
    </div>
</div>

<div id="imageViewer" onclick="closeViewer()">
    <span class="close-viewer">✕</span>
    <img id="fullImage" src="">
</div>

<!-- Всплывающая плашка -->
<div id="toast" class="toast">
    <span class="toast-icon">✓</span>
    <span id="toastMessage">Сохранено!</span>
</div>

<script>
    const owner = "newstaxsss-source";
    const repo = "homework-page";
    const path = "data.json";
    
    const p1 = "github_pat_11CNYWOEI0";
    const p2 = "N9Paa85yKNc7_UU87EqB7P";
    const p3 = "Y33nixP1z4ZTGG3HICTXJF";
    const p4 = "8VAChqvTYJNXGKQGVPIBkPKyu3ve";
    const token = p1 + p2 + p3 + p4;

    const scheduleTemplate = [
        { name: "Понеділок", color: "linear-gradient(135deg, #6c5ce7, #a29bfe)", lessons: ["Геометрія", "Українська мова", "Українська література", "Англійська мова", "Фізична культура", "Мистецтво"] },
        { name: "Вівторок", color: "linear-gradient(135deg, #ff7675, #fab1a0)", lessons: ["Физика", "Українська мова", "Всесвітня історія", "Хімія", "Біологія", "Алгебра"] },
        { name: "Середа", color: "linear-gradient(135deg, #fdcb6e, #ffeaa7)", lessons: ["Українська мова", "Фізика", "Астрономія", "Українська література", "Болгарська мова (ф)", "Болгарська література (ф)"] },
        { name: "Четвер", color: "linear-gradient(135deg, #55efc4, #81ecec)", lessons: ["Англійська мова", "Зарубіжна література", "Біологія", "Історія Украины", "Геометрія", "Географія", "Інформатика"] },
        { name: "П'ятниця", color: "linear-gradient(135deg, #74b9ff, #0984e3)", lessons: ["Фізика", "Хімія", "Фізична культура", "Алгебра", "Мистецтво", "Українська мова", "Година спілкування"] }
    ];

    let currentOffset = 0;
    let homeworkData = {};
    let activeLessonKey = null;
    let tempPhotos = [];
    let fileSha = null;
    let toastTimeout = null;

    function showToast(msg = "Сохранено!") {
        const toast = document.getElementById('toast');
        const text = document.getElementById('toastMessage');
        text.textContent = msg;
        
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    async function githubFetch() {
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (res.status === 200) {
                const json = await res.json();
                fileSha = json.sha;
                const content = decodeURIComponent(escape(atob(json.content)));
                homeworkData = JSON.parse(content);
                if(cleanOldData()) githubSave(true);
                else render();
            } else { homeworkData = {}; render(); }
        } catch (e) { homeworkData = {}; render(); }
    }

    function cleanOldData() {
        const now = new Date();
        let wasChanged = false;
        for (let key in homeworkData) {
            const dateStr = key.split('_')[0]; 
            const entryDate = new Date(dateStr);
            const diffDays = (now - entryDate) / (1000 * 60 * 60 * 24);
            if (diffDays > 14) { delete homeworkData[key]; wasChanged = true; }
        }
        return wasChanged;
    }

    async function githubSave(silent = false) {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(homeworkData))));
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "upd", content: content, sha: fileSha })
            });
            const data = await res.json();
            if (res.ok) {
                fileSha = data.content.sha;
                if(!silent) { 
                    showToast("Успешно сохранено!"); 
                    render(); 
                }
            }
        } catch (e) { console.error("Save error"); }
    }

    function getWeekDays(offset) {
        const start = new Date();
        start.setDate(start.getDate() - (start.getDay() === 0 ? 6 : start.getDay() - 1) + (offset * 7));
        return Array.from({length: 5}, (_, i) => {
            const d = new Date(start); d.setDate(d.getDate() + i); return d;
        });
    }

    function formatDate(d) { return d.toISOString().split('T')[0]; }

    function render() {
        const days = getWeekDays(currentOffset);
        document.getElementById('weekRange').textContent = 
            `${days[0].toLocaleDateString('ru', {day:'numeric', month:'short'})} — ${days[4].toLocaleDateString('ru', {day:'numeric', month:'short'})}`;

        const topRow = document.getElementById('topRow');
        const bottomRow = document.getElementById('bottomRow');
        topRow.innerHTML = ''; bottomRow.innerHTML = '';

        scheduleTemplate.forEach((dayInfo, idx) => {
            const dateStr = formatDate(days[idx]);
            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerHTML = `
                <div class="day-header" style="background: ${dayInfo.color}">
                    <span class="day-name">${dayInfo.name}</span>
                    <span class="day-date">${days[idx].toLocaleDateString('ru', {day:'numeric', month:'short'})}</span>
                </div>
                <div class="lessons-list">
                    ${dayInfo.lessons.map((name, lIdx) => {
                        const key = `${dateStr}_${lIdx}`;
                        const lessonData = homeworkData[key] || {};
                        const hasNote = lessonData.note && lessonData.note.trim().length > 0;
                        const hasPhotos = lessonData.photos && lessonData.photos.length > 0;
                        const hasHomework = hasNote || hasPhotos;
                        const isDone = lessonData.done === true;
                        
                        return `
                            <div class="lesson-item ${isDone ? 'is-done' : ''}" onclick="openModal('${dateStr}', ${lIdx}, '${name}')">
                                <div class="lesson-num">${lIdx + 1}</div>
                                <div class="lesson-name">${name}</div>
                                <div class="lesson-indicators">
                                    ${hasNote ? '<div class="dot dot-note"></div>' : ''}
                                    ${hasPhotos ? '<div class="dot dot-photo"></div>' : ''}
                                    ${hasHomework ? `
                                        <div class="done-toggle ${isDone ? 'active' : ''}" 
                                             onclick="event.stopPropagation(); toggleDone('${key}')">
                                             ✓
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            if (idx < 3) topRow.appendChild(card);
            else bottomRow.appendChild(card);
        });
    }

    function toggleDone(key) {
        if (!homeworkData[key]) return;
        homeworkData[key].done = !homeworkData[key].done;
        render(); 
        githubSave(true);
    }

    function openModal(date, idx, name) {
        activeLessonKey = `${date}_${idx}`;
        const data = homeworkData[activeLessonKey] || { note: '', photos: [], done: false };
        document.getElementById('modalTitle').textContent = name;
        document.getElementById('noteText').value = data.note || '';
        tempPhotos = [...(data.photos || [])];
        renderPhotos();
        document.getElementById('modalOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; document.body.style.overflow = 'auto'; }

    function handleFiles(files) {
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const max = 1200;
                    if (width > height && width > max) { height *= max/width; width = max; }
                    else if (height > max) { width *= max/height; height = max; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    tempPhotos.push(canvas.toDataURL('image/jpeg', 0.8));
                    renderPhotos();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function renderPhotos() {
        const container = document.getElementById('photoPreview');
        container.innerHTML = tempPhotos.map((src, i) => `
            <div class="img-wrap">
                <img src="${src}" onclick="viewImage('${src}')">
                <button class="del-img" onclick="event.stopPropagation(); tempPhotos.splice(${i},1); renderPhotos()">✕</button>
            </div>
        `).join('');
    }

    function viewImage(src) { document.getElementById('fullImage').src = src; document.getElementById('imageViewer').style.display = 'flex'; }
    function closeViewer() { document.getElementById('imageViewer').style.display = 'none'; }

    function saveData() {
        if (!activeLessonKey) return;
        const note = document.getElementById('noteText').value;
        const photos = tempPhotos;
        const isAlreadyDone = homeworkData[activeLessonKey]?.done || false;

        if (!note.trim() && photos.length === 0) {
            delete homeworkData[activeLessonKey];
        } else {
            homeworkData[activeLessonKey] = { note, photos, done: isAlreadyDone };
        }
        githubSave().then(() => closeModal());
    }

    function changeWeek(v) { currentOffset += v; render(); }
    function goToToday() { currentOffset = 0; render(); }

    window.onclick = (e) => { if (e.target == document.getElementById('modalOverlay')) closeModal(); };
    githubFetch();
</script>

</body>
</html>
