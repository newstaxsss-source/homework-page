<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #6c5ce7, #ff7675);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .nav-btn {
            background: var(--card-bg);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: transform 0.2s, background 0.2s;
            color: var(--text-main);
        }
        .nav-btn:hover { transform: translateY(-2px); background: #f8f9fa; }
        .current-week { font-weight: 600; color: var(--text-muted); min-width: 150px; text-align: center; font-size: 14px; }

        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .row-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .row-bottom {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            flex: 1;
            max-width: calc(33.33% - 20px);
            min-width: 320px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .day-header {
            padding: 18px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-name { font-weight: 700; font-size: 18px; }
        .day-date { font-size: 13px; opacity: 0.9; font-weight: 500; }

        .lessons-list { padding: 15px; }
        .lesson-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        .lesson-item:hover { background: #f1f2f6; }
        .lesson-num {
            width: 28px;
            height: 28px;
            background: #f1f2f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin-right: 15px;
            color: var(--accent);
        }
        .lesson-name { flex-grow: 1; font-weight: 500; font-size: 15px; }
        .lesson-indicators { display: flex; gap: 5px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-note { background: #6c5ce7; box-shadow: 0 0 8px rgba(108, 92, 231, 0.5); }
        .dot-photo { background: #ff7675; box-shadow: 0 0 8px rgba(255, 118, 117, 0.5); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-title { font-weight: 800; font-size: 22px; margin-bottom: 5px; }
        .modal-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #f1f2f6;
            resize: none;
            font-family: inherit;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--accent-light); }

        .photo-section { margin-bottom: 25px; }
        .photo-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .img-wrap {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f1f2f6;
        }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .del-img {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(255,118,117,0.9);
            color: white;
            border: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            font-size: 10px;
            cursor: pointer;
        }

        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-upload { background: #f1f2f6; color: var(--text-main); }
        .btn-save { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; }
        .btn:active { opacity: 0.8; }

        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: #f1f2f6;
            border: none; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer;
        }

        @media (max-width: 1000px) {
            .row-top { grid-template-columns: 1fr 1fr; }
            .row-bottom { flex-wrap: wrap; }
            .day-card { max-width: 100%; }
        }
        @media (max-width: 700px) {
            .row-top { grid-template-columns: 1fr; }
            .day-card { min-width: 100%; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Домашка</h1>
        <div class="nav-controls">
            <button class="nav-btn" onclick="changeWeek(-1)">←</button>
            <div class="current-week" id="weekRange">Загрузка...</div>
            <button class="nav-btn" onclick="goToToday()">Сегодня</button>
            <button class="nav-btn" onclick="changeWeek(1)">→</button>
        </div>
    </header>

    <div class="schedule-grid" id="schedule">
        <div class="row-top" id="topRow"></div>
        <div class="row-bottom" id="bottomRow"></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-modal" onclick="closeModal()">✕</button>
        <div class="modal-title" id="modalTitle">Урок</div>
        <div class="modal-subtitle" id="modalSubtitle">Заметки и фото</div>
        
        <textarea id="noteText" placeholder="Напиши домашку сюда..."></textarea>
        
        <div class="photo-section">
            <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleFiles(this.files)">
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">+ Добавить фото</button>
            <div class="photo-preview" id="photoPreview"></div>
        </div>

        <div class="actions">
            <button class="btn btn-save" onclick="saveData()">Сохранить</button>
        </div>
    </div>
</div>
